<body>
    <h1>learning videos</h1>

    <!-- go to any any site or YT, go to share option, find "embed" option, copy the url, paste it here

    This is a video from site <br>

    <div style="padding:56.25% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/970075397?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write" style="position:absolute;top:0;left:0;width:300px;height:300px;" title="Palliative Care Queensland: The Cassette"></iframe></div><script src="https://player.vimeo.com/api/player.js"></script>

    <iframe width="300px" height="300px" src="https://www.youtube.com/embed/jx5FetT_uuU?si=sOeTe8FZHLFza3oc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <!-- you can also add any video from the file if that video is present in the file (HTML file for this PC, bcoz this directry is selected in the VS code) -->

    <video src="/video/Video 1.mp4" width="300px" controls autoplay loop></video>
        <!-- its imp that you must add "controls" in the video tag, or else you wont be ablt ot run the video-->
        <!-- "loop" = video will run in loop -->
    <video src="/video/Video 2.mp4" width="600px" controls loop></video>
    <br><br>
    
    <h3>video using poster  (like thumbnails)</h3>
    <video src="/video/Video 2.mp4" controls width="500" poster="/img/img 3.jpg"></video>
    <!-- "posteer" = poster is like putting thumbnail into a video
     "muted" = muting a video -->
     <br><br>

    <h3>this is audio file</h3>
     <audio src="/audio/audio 1.mp3" controls></audio> <br>
     <!-- "audio" and enter
      add this to hear audio files, you cant add poster into an audio file -->
    
      <!-- Preload --
        This enumerated attribute is intended to provide a hint to the browser about what the author thinks will lead to the best user experience. It may have one of the following values:

            none -- Indicates that the audio should not be preloaded.
            metadata -- Indicates that only audio metadata (e.g. length) is fetched.
            auto -- Indicates that the whole audio file can be downloaded, even if the user is not expected to use it.
        empty string -- A synonym of the auto value. -->

    <audio src="/audio/audio 1.mp3" controls preload="none"></audio>
    <audio src="/audio/audio 1.mp3" controls preload="metadata"></audio>
    <audio src="/audio/audio 1.mp3" controls preload="auto"></audio>

</body>
</html>
