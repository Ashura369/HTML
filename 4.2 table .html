<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table tags</title>
</head>
<body>
    <table>
        <caption>Max scores by different players in Cricket</caption>
        <!-- "caption" = used to add captions -->
        <tr>
            <!-- "tr" = table row -->
            <!-- "th" = table header(headings) -->
            <th>S.No</th>
            <th>Player name</th>
            <th>Max Score</th>
            <th>Game</th>
        </tr>

        <tr>
            <!-- "td" = table data -->
            <td>1</td>
            <td>Sachin</td>
            <td>123</td>
            <td>Cricket</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Rocky</td>
            <td>253</td>
            <td>Cricket</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Rambo</td>
            <td>369</td>
            <td>Cricket</td>
        </tr>
    </table>
    
</body>
</html>
