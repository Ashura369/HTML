<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>entities and code tags</title>
</head>

<body>
    <h2>using entities</h2>
    <!-- printing "<p> </p>" exactly, so we hav eto replace "<" with " &lt;" and ">" with "&gt;"
     it will print it as it. If you try print the tag as it is by writing it directly it will not be shown on the site -->

    this is the paragraph tag : -- &lt; p &gt; &lt; /p &gt;
    <br>
    <!-- 
    Common HTML entities are : --
        &lt;  = <
        &gt;  = >
        &amp; = &
        &nbsp; = a non-breaking space (used to add more than one space)
        &copy; = © (copyright sign)
        
    -->

    &lt; <br>
    &gt; <br>
    &amp; <br>
    &nbsp; <br>
    &copy; <br>

    this an &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; example of "a non-breaking space"

</body>

</html>
