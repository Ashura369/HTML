    <title>ID and Classes in HTML</title>
</head>
<body>
    
    <!-- "ID" = an ID is an unique attribute, a unique identifier assigned to only one HTML element (div, form, b, i, u, a, p, etc) within  a page. It is often used for unique styling and JavaScript manipulations -->

    <!-- "Classes" = Class attribute gives the same name to multiple HTML elements. That way, you can easily change their look or behaviour all at once. Classes are not unique and can be assigned to multiple elements. They area generally used for appllying the same style or behaviours to a group of elements -->
    
    <div id="first" class="red flag"></div> First
    <div id="second" class="red flag"></div> Second <br>
    <span class="red flag"></span> Third

        <!-- at different elements you have to use different IDs, and
         at different elements you can use different and even same Class.
         
         Even if you give same name to different IDs the reaualt on site 
         will be shownb but it will cause problems while using CSS (while specifying the elements) -->
