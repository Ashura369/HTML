<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ul & ol practice</title>
</head>
<body>
    <h1>Learning Lists !</h1>
    <section>
        <b><h2>Unordered list</h2></b>
        <ul type = "square">
            <li>Aman</li>
            <li>Anil</li>
            <li>Jeet</li>
            <li>Shruti</li>
            <li>Utkalika</li>
            <li>Punam</li>
            <li>Rashi</li>
        </ul>
    </section>

    <section>
        <b><h2>Ordered list</h2></b>
        <ol type = "1">
            <li>Aman</li>
            <li>Anil</li>
            <li>Jeet</li>
            <li>Shruti</li>
            <li>Utkalika</li>
            <li>Punam</li>
            <li>Rashi</li>
        </ol>
    </section>
</body>
</html>
